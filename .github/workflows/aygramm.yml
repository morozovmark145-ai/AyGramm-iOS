name: AyGramm IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      # tgcalls подключён относительной ссылкой ../tgcalls.git. В копии она ведёт в аккаунт владельца копии,
      # поэтому ссылка заменяется на оригинальный репозиторий Telegram.
      - name: Submodules
        run: |
          git config -f .gitmodules submodule.submodules/TgVoipWebrtc/tgcalls.url https://github.com/TelegramMessenger/tgcalls.git
          git submodule sync --recursive
          git -c protocol.version=2 submodule update --init --force --depth=1 --recursive --jobs 8
          git submodule status --recursive | head -20

      - name: Select Xcode
        run: |
          XCODE_VERSION=$(python3 -c 'import json;print(json.load(open("versions.json"))["xcode"])')
          sudo xcode-select -s /Applications/Xcode_$XCODE_VERSION.app/Contents/Developer
          xcodebuild -version
          df -h /

      - name: Canonical source directory
        run: |
          sudo mkdir -p /Users/Shared
          sudo chown "$(whoami)" /Users/Shared
          cp -R "$GITHUB_WORKSPACE" /Users/Shared/telegram-ios

      - name: AyGramm changes (name, icon, storage)
        run: bash /Users/Shared/telegram-ios/aygramm/patch.sh /Users/Shared/telegram-ios

      - name: Configuration with own api_id
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          test -n "$API_ID" && test -n "$API_HASH"
          python3 - <<'EOF'
          import json, os
          # Те же настройки, что в официальной сборке без подписи, кроме своих api_id и api_hash.
          cfg = json.load(open("/Users/Shared/telegram-ios/build-system/appstore-configuration.json"))
          cfg["api_id"] = os.environ["API_ID"].strip()
          cfg["api_hash"] = os.environ["API_HASH"].strip()
          # Права на Siri и iCloud пропадают при подписи в KSign, вызовы этих служб закрывают приложение.
          cfg["enable_siri"] = False
          cfg["enable_icloud"] = False
          json.dump(cfg, open("/Users/Shared/aygramm-config.json", "w"), indent=2)
          print("config keys:", sorted(cfg))
          EOF

      - name: Build
        run: |
          set -x
          cd /Users/Shared/telegram-ios
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="/private/var/tmp/_bazel_containerhost" \
            build \
            --configurationPath="/Users/Shared/aygramm-config.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="${{ github.run_number }}00"
          mkdir -p "$GITHUB_WORKSPACE/out"
          # Bazel кладёт готовый файл по ссылке bazel-bin/Telegram/Telegram.ipa.
          # Свой Bundle ID com.personal.aygramm, чтобы AyGramm ставился рядом с официальным Telegram.
          python3 "$GITHUB_WORKSPACE/aygramm/rebundle.py" bazel-bin/Telegram/Telegram.ipa "$GITHUB_WORKSPACE/out/AyGramm.ipa"
          ls -la "$GITHUB_WORKSPACE/out"

      - uses: actions/upload-artifact@v4
        with:
          name: AyGramm-ipa
          path: out/AyGramm.ipa
          retention-days: 30
